[project]
name = "telegram-mcp"
version = "0.1.0"
description = "MCP server for personal Telegram access over MTProto"
readme = "README.md"
authors = [{ name = "Mikhail Savin", email = "mail@jtprog.ru" }]
requires-python = ">=3.12,<3.15"
dependencies = [
    "mcp[cli]>=1.2",
    "telethon>=1.44",
]

[project.scripts]
telegram-mcp = "telegram_mcp.main:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_mcp"]

[tool.ruff]
line-length = 120
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
